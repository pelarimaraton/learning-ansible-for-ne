name: sw03-02
mgmt:
  network: sw03-02-mgmt
  ipv4-subnet: 172.31.32.0/24

topology:
  defaults:
    kind: cisco_iol
    type: L2
    image: vrnetlab/cisco_iol:L2-17.18.02
  nodes:
    spine1:
      mgmt-ipv4: 172.31.32.11
    spine2:
      mgmt-ipv4: 172.31.32.12
    leaf1:
      mgmt-ipv4: 172.31.32.13
    leaf2:
      mgmt-ipv4: 172.31.32.14
    leaf3:
      mgmt-ipv4: 172.31.32.15
  links:
    - endpoints: ["spine1:Ethernet0/1", "leaf1:Ethernet0/1"]
    - endpoints: ["spine1:Ethernet0/2", "leaf2:Ethernet0/1"]
    - endpoints: ["spine1:Ethernet0/3", "leaf3:Ethernet0/1"]
    - endpoints: ["spine2:Ethernet0/1", "leaf1:Ethernet0/2"]
    - endpoints: ["spine2:Ethernet0/2", "leaf2:Ethernet0/2"]
    - endpoints: ["spine2:Ethernet0/3", "leaf3:Ethernet0/2"]
